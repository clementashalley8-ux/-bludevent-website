<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>BluDevent | Ticket Registration</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 520px;
      margin: 30px auto;
      background: #202020;
      padding: 24px;
      border: 1px solid #444;
      border-radius: 14px;
    }
    h1 {
      color: #e6bd55;
      text-align: center;
    }
    h2 {
      color: #e6bd55;
    }
    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input,
    textarea {
      background: white;
      color: #111;
      border: 1px solid #888;
    }
    textarea {
      min-height: 240px;
      resize: vertical;
      font-family: monospace;
    }
    button {
      background: #e6bd55;
      color: #111;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .note {
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
    }
    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 7px;
      background: #292929;
      line-height: 1.6;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>BluDevent 🎟️</h1>
    <h2>Ticket Registration</h2>
    <p class="note">
      Authorized event staff only.
      Sign in to register tickets in Firebase.
    </p>
    <!-- STAFF LOGIN -->
    <section id="loginSection">
      <label for="email">Staff email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your staff email"
        required
      >
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >
      <button id="loginButton" type="button">
        Staff Login
      </button>
    </section>
    <!-- TICKET REGISTRATION -->
    <section id="registrationSection" class="hidden">
      <p id="staffStatus" class="note"></p>
      <label for="codes">
        Ticket codes — one code per line
      </label>
      <textarea
        id="codes"
        placeholder="BLU26-K7MPQX&#10;BLU26-R4T9WA"
        spellcheck="false"
      ></textarea>
      <p class="note">
        You can submit up to 400 codes at once.
        Each code must have six letters or numbers
        after BLU26-.
      </p>
      <button id="registerButton" type="button">
        Register Tickets
      </button>
      <button id="logoutButton" type="button">
        Sign Out
      </button>
    </section>
    <p id="message" role="status" aria-live="polite">
      Please sign in with your authorized staff account.
    </p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
    "use strict";
    // Firebase web configuration.
    // Never put a service-account private key here.
    const firebaseConfig = {
      apiKey: "AIzaSyCmPjjhOnzp7VXQD9tiH23Pw7ynLVTKx4Y",
      authDomain: "blud-event-tickets.firebaseapp.com",
      projectId: "blud-event-tickets",
      storageBucket: "blud-event-tickets.firebasestorage.app",
      messagingSenderId: "887215943140",
      appId: "1:887215943140:web:7c8a5abe753cdd4dec2bf1"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const loginSection =
      document.getElementById("loginSection");
    const registrationSection =
      document.getElementById("registrationSection");
    const emailInput =
      document.getElementById("email");
    const passwordInput =
      document.getElementById("password");
    const codesInput =
      document.getElementById("codes");
    const loginButton =
      document.getElementById("loginButton");
    const registerButton =
      document.getElementById("registerButton");
    const message =
      document.getElementById("message");
    function showMessage(text) {
      message.textContent = text;
    }
    // Update the page when authentication changes.
    auth.onAuthStateChanged(function(user) {
      loginSection.classList.toggle("hidden", !!user);
      registrationSection.classList.toggle(
        "hidden",
        !user
      );
      if (user) {
        document.getElementById("staffStatus").textContent =
          "Signed in as " + (user.email || "staff") +
          ". Email verification is required.";
        showMessage(
          "Signed in. You can prepare your ticket codes."
        );
      } else {
        showMessage(
          "Please sign in with your authorized staff account."
        );
      }
    });
    // STAFF LOGIN
    loginButton.addEventListener("click", async function() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        showMessage("Enter your staff email and password.");
        return;
      }
      loginButton.disabled = true;
      showMessage("Signing in...");
      try {
        await auth.signInWithEmailAndPassword(
          email,
          password
        );
        passwordInput.value = "";
        showMessage(
          "Login successful. Preparing registration page..."
        );
      } catch (error) {
        console.error("Staff login failed:", error.code);
        showMessage(
          "Login failed. Check your details and confirm " +
          "Email/Password sign-in is enabled in Firebase."
        );
      } finally {
        loginButton.disabled = false;
      }
    });
    // REGISTER TICKETS
    registerButton.addEventListener(
      "click",
      async function() {
        const user = auth.currentUser;
        if (!user) {
          showMessage("Please sign in first.");
          return;
        }
        const codes = codesInput.value
          .split(/\r?\n/)
          .map(function(code) {
            return code.trim().toUpperCase();
          })
          .filter(Boolean);
        if (codes.length === 0 || codes.length > 400) {
          showMessage(
            "Enter between 1 and 400 ticket codes."
          );
          return;
        }
        // Validate every code.
        const validFormat = codes.every(function(code) {
          return /^BLU26-[A-Z0-9]{6}$/.test(code);
        });
        if (!validFormat) {
          showMessage(
            "Invalid code format. Example: BLU26-K7MPQX"
          );
          return;
        }
        // Prevent duplicate codes in this submission.
        if (new Set(codes).size !== codes.length) {
          showMessage(
            "Duplicate codes found. Remove duplicates and try again."
          );
          return;
        }
        const confirmed = window.confirm(
          "You are about to register " +
          codes.length +
          " tickets. Continue?"
        );
        if (!confirmed) {
          return;
        }
        registerButton.disabled = true;
        try {
          showMessage(
            "Checking staff authorization and registering tickets..."
          );
          // Refresh the Firebase ID token.
          const idToken = await user.getIdToken(true);
          const response = await fetch(
            "/.netlify/functions/register-tickets",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + idToken
              },
              body: JSON.stringify({
                codes: codes
              })
            }
          );
          let data;
          try {
            data = await response.json();
          } catch {
            throw new Error(
              "The server returned an invalid response."
            );
          }
          if (!response.ok) {
            let errorMessage =
              data.message || "Registration failed.";
            if (
              Array.isArray(data.existingCodes) &&
              data.existingCodes.length > 0
            ) {
              errorMessage +=
                "\nExisting codes: " +
                data.existingCodes.join(", ");
            }
            showMessage(errorMessage);
            return;
          }
          showMessage(
            "SUCCESS! " +
            data.registered +
            " tickets registered in Firebase."
          );
          codesInput.value = "";
        } catch (error) {
          console.error(
            "Ticket registration request failed:",
            error
          );
          showMessage(
            "Registration could not be completed. " +
            "Check the deployment and try again."
          );
        } finally {
          registerButton.disabled = false;
        }
      }
    );
    // SIGN OUT
    document.getElementById("logoutButton")
      .addEventListener("click", async function() {
        try {
          await auth.signOut();
          codesInput.value = "";
          passwordInput.value = "";
          showMessage("You have signed out.");
        } catch (error) {
          showMessage("Unable to sign out. Try again.");
        }
      });
  </script>
</body>
</html>
